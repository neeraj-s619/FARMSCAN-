<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FasalDrishti AI - Select Language</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@500;700;800&family=Noto+Sans+Devanagari:wght@700&family=Noto+Sans+Tamil:wght@700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Public Sans"', 'sans-serif'],
                        display: ['"Archivo Black"', 'sans-serif'],
                        hindi: ['"Noto Sans Devanagari"', 'sans-serif'],
                        tamil: ['"Noto Sans Tamil"', 'sans-serif'],
                    },
                    colors: {
                        neo: {
                            green: '#00D664', // Signature Green
                            black: '#121212',
                            white: '#FFFFFF',
                            alert: '#FF4D4D'
                        }
                    },
                    boxShadow: {
                        'hard': '4px 4px 0px 0px #121212',
                        'hard-hover': '2px 2px 0px 0px #121212',
                    },
                    borderWidth: {
                        '3': '3px',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #F3F4F6;
            color: #121212;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .language-card {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .language-card:active {
            transform: translate(2px, 2px);
            box-shadow: none;
            background-color: #E8FDF5;
            border-color: #00D664;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-[100dvh] w-full flex flex-col items-center justify-center relative bg-white/90 backdrop-blur-sm py-10">

    <div class="mb-8 flex justify-center animate-fade-in-up">
        <div class="w-20 h-20 bg-neo-green border-3 border-neo-black rounded-full flex items-center justify-center shadow-hard">
            <i data-lucide="globe" class="w-10 h-10 text-white stroke-[2.5]"></i>
        </div>
    </div>

    <main class="w-full max-w-sm px-6 z-10 text-center">
        
        <div class="mb-10 animate-fade-in-up" style="animation-delay: 0.1s;">
            <h1 class="font-display text-3xl uppercase leading-none tracking-tighter text-neo-black mb-3">
                Select Your<br>Language
            </h1>
            <p class="font-bold text-sm text-gray-500 font-hindi leading-relaxed">
                अपनी भाषा चुनें / உங்கள் மொழியைத் தேர்ந்தெடுக்கவும்
            </p>
        </div>

        <div class="space-y-4 animate-fade-in-up" style="animation-delay: 0.2s;">
            
            <button onclick="selectLanguage('en')" class="language-card w-full bg-white border-3 border-neo-black p-4 shadow-hard flex items-center gap-5 group hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_#121212]">
                <div class="w-12 h-12 bg-gray-100 border-2 border-neo-black flex items-center justify-center font-black text-lg">
                    US
                </div>
                <div class="text-left">
                    <h3 class="font-display text-xl uppercase tracking-wide group-hover:text-neo-green transition-colors">English</h3>
                    <p class="font-bold text-[10px] text-gray-400 uppercase tracking-widest">Default</p>
                </div>
                <div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
                    <i data-lucide="arrow-right" class="w-6 h-6 stroke-[3]"></i>
                </div>
            </button>

            <button onclick="selectLanguage('hi')" class="language-card w-full bg-white border-3 border-neo-black p-4 shadow-hard flex items-center gap-5 group hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_#121212]">
                <div class="w-12 h-12 bg-gray-100 border-2 border-neo-black flex items-center justify-center font-hindi font-bold text-lg">
                    अ
                </div>
                <div class="text-left">
                    <h3 class="font-hindi font-bold text-2xl group-hover:text-neo-green transition-colors leading-none mb-1">हिंदी</h3>
                    <p class="font-bold text-[10px] text-gray-400 uppercase tracking-widest">Hindi</p>
                </div>
                <div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
                    <i data-lucide="arrow-right" class="w-6 h-6 stroke-[3]"></i>
                </div>
            </button>

            <button onclick="selectLanguage('ta')" class="language-card w-full bg-white border-3 border-neo-black p-4 shadow-hard flex items-center gap-5 group hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_#121212]">
                <div class="w-12 h-12 bg-gray-100 border-2 border-neo-black flex items-center justify-center font-tamil font-bold text-lg pt-1">
                    அ
                </div>
                <div class="text-left">
                    <h3 class="font-tamil font-bold text-2xl group-hover:text-neo-green transition-colors leading-none mb-1">தமிழ்</h3>
                    <p class="font-bold text-[10px] text-gray-400 uppercase tracking-widest">Tamil</p>
                </div>
                <div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
                    <i data-lucide="arrow-right" class="w-6 h-6 stroke-[3]"></i>
                </div>
            </button>

        </div>

        <div class="mt-12 opacity-50 animate-fade-in-up" style="animation-delay: 0.3s;">
            <p class="font-bold text-[10px] uppercase tracking-widest">You can change this later in settings</p>
        </div>

    </main>

    <script>
        lucide.createIcons();

        function selectLanguage(lang) {
            // Store preference (simulated)
            console.log(`Language selected: ${lang}`);
            
            // Add selection effect manually if needed, but CSS :active handles visual feedback
            
            // Redirect to Dashboard
            setTimeout(() => {
                window.location.href = 'index.html'; // Assuming index.html handles localization or is the next step
            }, 300);
        }
    </script>
</body>
</html>
