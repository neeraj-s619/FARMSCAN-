<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FasalDrishti AI - Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@500;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Public Sans"', 'sans-serif'],
                        display: ['"Archivo Black"', 'sans-serif'],
                    },
                    colors: {
                        neo: {
                            green: '#00D664', // Signature Green
                            black: '#121212',
                            white: '#FFFFFF',
                            alert: '#FF4D4D'
                        }
                    },
                    boxShadow: {
                        'hard': '4px 4px 0px 0px #121212',
                        'hard-hover': '2px 2px 0px 0px #121212',
                    },
                    borderWidth: {
                        '3': '3px',
                    },
                    animation: {
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #F3F4F6;
            color: #121212;
            overflow: hidden;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .neo-input:focus {
            background-color: #E8FDF5;
            outline: none;
            box-shadow: 4px 4px 0px 0px #121212;
            transform: translate(-2px, -2px);
        }
        
        .neo-transition { transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col items-center justify-center relative bg-white/90 backdrop-blur-sm">

    <div id="toast" class="fixed top-4 left-4 right-4 z-50 transform -translate-y-[150%] transition-transform duration-300">
        <div class="bg-neo-black border-l-8 border-neo-alert p-4 shadow-hard flex items-center gap-3 text-white">
            <i data-lucide="triangle-alert" class="w-6 h-6 stroke-[3] text-neo-alert"></i>
            <span id="toast-msg" class="font-bold uppercase tracking-wide text-sm leading-tight">Error Message</span>
        </div>
    </div>

    <main class="w-full max-w-sm px-6 z-10">
        
        <div class="mb-10 animate-fade-in-up">
            <div class="inline-flex items-center gap-2 border-3 border-neo-black px-3 py-1 bg-neo-green shadow-hard mb-6 transform -rotate-2 origin-left">
                <i data-lucide="scan-eye" class="w-4 h-4 stroke-[3]"></i>
                <span class="font-display text-[10px] tracking-wide uppercase">AI Version 3.0</span>
            </div>
            
            <h1 class="font-display text-4xl uppercase leading-none tracking-tighter text-neo-black mb-3">
                FasalDrishti<span class="text-neo-green">.AI</span>
            </h1>

            <div class="flex items-center gap-3 border-l-4 border-neo-black pl-3">
                <p class="font-black text-sm text-gray-500 uppercase tracking-widest leading-none">
                    Scan. Detect. Protect.
                </p>
            </div>
        </div>

        <form id="loginForm" class="space-y-6" onsubmit="return false;">
            
            <div class="group">
                <label class="block font-black text-[10px] uppercase tracking-widest mb-1.5 ml-1 group-focus-within:text-neo-green transition-colors">Mobile Number</label>
                <div class="relative">
                    <input type="tel" id="identity" 
                        class="neo-input w-full bg-white border-3 border-neo-black p-3.5 pl-4 font-bold text-lg placeholder-gray-300 rounded-none neo-transition text-neo-black" 
                        placeholder="98765 43210" maxlength="10">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                        <i data-lucide="smartphone" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <div class="group">
                <div class="flex justify-between items-center mb-1.5 ml-1">
                    <label class="block font-black text-[10px] uppercase tracking-widest group-focus-within:text-neo-green transition-colors">Password</label>
                    <a href="#" class="text-[10px] font-bold text-gray-400 underline decoration-2 hover:text-neo-black">Forgot?</a>
                </div>
                <div class="relative">
                    <input type="password" id="password" 
                        class="neo-input w-full bg-white border-3 border-neo-black p-3.5 pl-4 font-bold text-lg placeholder-gray-300 rounded-none neo-transition" 
                        placeholder="••••••">
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 hover:text-neo-green transition-colors p-2">
                        <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <button onclick="handleLogin()" id="submitBtn" class="w-full bg-neo-black text-white border-3 border-neo-black p-4 shadow-hard neo-transition 
                hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-hard-hover 
                active:translate-x-[4px] active:translate-y-[4px] active:shadow-none active:bg-neo-green active:border-neo-black
                mt-6 flex items-center justify-center gap-3">
                
                <span id="btnText" class="font-display text-lg tracking-wide uppercase">Access Your Farm</span>
                
                <div id="btnLoader" class="hidden">
                    <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-white"></i>
                </div>
            </button>

            <div class="relative flex py-2 items-center opacity-60">
                <div class="flex-grow border-t-2 border-dashed border-gray-400"></div>
                <span class="flex-shrink-0 mx-4 text-[10px] font-black uppercase text-gray-500">Quick Access</span>
                <div class="flex-grow border-t-2 border-dashed border-gray-400"></div>
            </div>

            <button onclick="handleGoogleLogin()" type="button" id="googleBtn" class="w-full bg-white border-3 border-neo-black p-3 shadow-hard-sm neo-transition hover:bg-gray-50 flex items-center justify-center gap-3 active:shadow-none active:translate-x-[3px] active:translate-y-[3px] group relative overflow-hidden">
                <div class="relative z-10 flex items-center gap-3">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    <span id="googleText" class="font-bold text-xs uppercase tracking-wide">Continue with Google</span>
                </div>
                <div id="googleLoader" class="hidden absolute inset-0 flex items-center justify-center bg-white z-20">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-neo-black"></i>
                </div>
            </button>

        </form>
    </main>

    <script>
        lucide.createIcons();

        // 1. Password Toggle
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // 2. Login Logic
        function handleLogin() {
            const phone = document.getElementById('identity').value;
            const password = document.getElementById('password').value;
            const btnLoader = document.getElementById('btnLoader');
            const btnText = document.getElementById('btnText');
            const btn = document.getElementById('submitBtn');

            // Reset Styles
            document.querySelectorAll('input').forEach(el => {
                el.classList.remove('bg-red-50', 'border-neo-alert', 'text-neo-alert');
            });

            // Validation
            if (!phone) { showToast('Phone Number Required'); highlightError('identity'); return; }
            if (!/^[6-9]\d{9}$/.test(phone)) { showToast('Invalid Mobile Number'); highlightError('identity'); return; }
            if (!password) { showToast('Enter Password'); highlightError('password'); return; }

            // Success State
            // Make button stay green and remove text
            btn.classList.remove('bg-neo-black');
            btn.classList.add('bg-neo-green');
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            
            // Redirect
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        // 3. Google Login Logic
        function handleGoogleLogin() {
            const loader = document.getElementById('googleLoader');
            loader.classList.remove('hidden');
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        // 4. Error Styling
        function highlightError(id) {
            const el = document.getElementById(id);
            el.classList.add('bg-red-50', 'border-neo-alert', 'text-neo-alert');
            el.focus();
            
            const form = document.getElementById('loginForm');
            form.classList.add('animate-shake');
            setTimeout(() => form.classList.remove('animate-shake'), 500);
        }

        // 5. Toast Logic
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            
            msgEl.innerText = message;
            toast.classList.remove('-translate-y-[150%]');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('-translate-y-[150%]');
            }, 3000);
        }

        // 6. Input Masking
        document.getElementById('identity').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

    </script>
</body>
</html>
